h2{color:white;margin:40px 0 15px 5px;border-left:4px solid #ff0055;padding-left:10px;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px;max-width:1200px;margin:auto}
.card{background:#161616;border-radius:12px;overflow:hidden;border:1px solid #222}
.card img{width:100%;height:250px;object-fit:cover;background:#222}
.info{padding:10px}
.info h3{font-size:13px;margin:0 0 6px 0;height:32px;overflow:hidden}
.time{font-size:11px;color:#999;margin-bottom:7px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.tag{font-size:10px;border:1px solid #ff0055;color:#ff0055;padding:2px 7px;border-radius:20px}
.btn{display:block;background:#ff0055;color:white;text-align:center;padding:7px;border-radius:6px;text-decoration:none;font-weight:bold;font-size:12px}
</style>

function createCard(a){
  return `<div class="card">
    <img src="${a.img}" onerror="this.src='https://via.placeholder.com/170x250/161616/ff0055?text=No+Image'">
    <div class="info">
      <h3>${a.name}</h3>
      <div class="time"><font color="#FF0000">◉</font> ${a.time}</div>
      <div class="tags"><span class="tag">${a.dub}</span>${a.genre.map(g=>`<span class="tag">${g}</span>`).join('')}</div>
      <a class="btn" href="${a.link}" target="_blank">WATCH NOW</a>
    </div>
  </div>`;
}
